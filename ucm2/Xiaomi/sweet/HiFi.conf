# Use case configuration for Xiaomi Redmi Note 10 Pro

SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
	]
	DisableSequence [
		cdev "hw:${CardId}"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "100"
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		# aw88261 default is 180 (-45 dB); 300 = -15 dB
		cset "name='Speaker PCM Playback Volume' 300"
		cset "name='Microphone PCM Playback Volume' 300"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels "1"
		CapturePriority "100"
	}
	EnableSequence [
		cdev "hw:${CardId}"
		# Keep the ADC2 path off, otherwise two SoundWire ports are active
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'ADC0'"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX_DEC0 Volume' 90"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
}
